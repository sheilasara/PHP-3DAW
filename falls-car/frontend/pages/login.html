<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entrar — Falls Car</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600&family=Roboto+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
</head>
<body>

<div class="tela-auth">
    <div class="tela-auth__lateral">
        <div class="topbar__marca" style="margin-bottom:2rem;"><span class="farol"></span> FALLS CAR</div>
        <h1 style="font-size:2rem;">Bem-vindo<br>de volta.</h1>
        <p class="texto-fraco" style="color:var(--neblina-200);max-width:320px;">
            Acesse sua conta para ver suas reservas, o histórico de locações e alugar um novo veículo.
        </p>
    </div>

    <div class="tela-auth__form">
        <div class="tela-auth__form-interna">
            <h2>Entrar</h2>
            <p class="texto-fraco espaco-topo" style="margin-bottom:1.2rem;">Acesse a área do cliente Falls Car.</p>

            <div class="alerta alerta-erro" id="alerta"></div>

            <form id="form-login">
                <div class="form-grupo">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" required placeholder="voce@email.com">
                </div>
                <div class="form-grupo">
                    <label for="senha">Senha</label>
                    <input type="password" id="senha" required placeholder="••••••••">
                </div>
                <button type="submit" class="btn btn-primario btn-bloco" id="btn-entrar">Entrar</button>
            </form>

            <p class="texto-centro espaco-topo texto-fraco">
                Ainda não tem conta? <a href="cadastro.html" style="color:var(--ambar-600);font-weight:600;">Cadastre-se</a>
            </p>
        </div>
    </div>
</div>

<script src="../js/api.js"></script>
<script>
    const alerta = document.getElementById('alerta');
    const botao = document.getElementById('btn-entrar');

    document.getElementById('form-login').addEventListener('submit', async (evento) => {
        evento.preventDefault();
        ocultarAlerta(alerta);

        const email = document.getElementById('email').value.trim();
        const senha = document.getElementById('senha').value;

        botao.disabled = true;
        botao.textContent = 'Entrando...';

        try {
            await API.login(email, senha);
            window.location.href = 'veiculos.html';
        } catch (erro) {
            mostrarAlerta(alerta, erro.message, 'erro');
            botao.disabled = false;
            botao.textContent = 'Entrar';
        }
    });
</script>
</body>
</html>
