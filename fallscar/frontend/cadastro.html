<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Cadastro - Falls Car</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
    <div class="logo">Falls<span>Car</span></div>
    <nav>
        <a href="index.html">Inicio</a>
        <a href="veiculos.html">Veiculos</a>
        <a href="minhas_reservas.html">Minhas Reservas</a>
        <a href="login.html" id="linkLogin">Login</a>
        <a href="cadastro.html" id="linkCadastro">Cadastrar</a>
        <a href="#" id="linkSair" style="display:none;">Sair</a>
    </nav>
</header>

<main>
    <h1>Criar Conta</h1>

    <div id="mensagem"></div>

    <form id="formCadastro">
        <div class="campo">
            <label for="nome">Nome completo</label>
            <input type="text" id="nome" name="nome" required>
        </div>

        <div class="campo">
            <label for="cpf">CPF</label>
            <input type="text" id="cpf" name="cpf" placeholder="000.000.000-00" required>
        </div>

        <div class="campo">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required>
        </div>

        <div class="campo">
            <label for="senha">Senha</label>
            <input type="password" id="senha" name="senha" required minlength="6">
        </div>

        <div class="campo">
            <label for="habilitacao">Numero da habilitacao (CNH)</label>
            <input type="text" id="habilitacao" name="habilitacao" required>
        </div>

        <div class="campo">
            <label for="endereco">Endereco</label>
            <input type="text" id="endereco" name="endereco" required>
        </div>

        <button type="submit">Cadastrar</button>
    </form>

    <p style="text-align:center; margin-top:15px;">
        Ja tem conta? <a href="login.html"><strong>Faca login</strong></a>
    </p>
</main>

<script src="js/cadastro.js"></script>
</body>
</html>
