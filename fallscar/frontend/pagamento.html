<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Pagamento - Falls Car</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
    <div class="logo">Falls<span>Car</span></div>
    <nav>
        <a href="index.html">Inicio</a>
        <a href="veiculos.html">Veiculos</a>
        <a href="minhas_reservas.html">Minhas Reservas</a>
        <a href="login.html" id="linkLogin">Login</a>
        <a href="cadastro.html" id="linkCadastro">Cadastrar</a>
        <a href="#" id="linkSair" style="display:none;">Sair</a>
    </nav>
</header>

<main>
    <h1>Pagamento</h1>

    <div id="resumoReserva"></div>
    <div id="mensagem"></div>

    <form id="formPagamento">
        <input type="hidden" id="reserva_id" name="reserva_id">

        <div class="campo">
            <label>Metodo de pagamento</label>
            <div class="opcoes-pagamento">
                <label><input type="radio" name="metodo" value="cartao" checked> Cartao de credito</label>
                <label><input type="radio" name="metodo" value="pix"> Pix</label>
            </div>
        </div>

        <div id="camposCartao">
            <div class="campo">
                <label for="nome_impresso">Nome impresso no cartao</label>
                <input type="text" id="nome_impresso" name="nome_impresso">
            </div>

            <div class="campo">
                <label for="numero_cartao">Numero do cartao</label>
                <input type="text" id="numero_cartao" name="numero_cartao" placeholder="0000 0000 0000 0000" maxlength="19">
            </div>

            <div class="campo">
                <label for="validade">Validade (MM/AAAA)</label>
                <input type="text" id="validade" name="validade" placeholder="MM/AAAA" maxlength="7">
            </div>

            <div class="campo">
                <label for="cvv">CVV</label>
                <input type="text" id="cvv" name="cvv" maxlength="4">
            </div>
        </div>

        <button type="submit">Confirmar Pagamento</button>
    </form>
</main>

<script src="js/pagamento.js"></script>
</body>
</html>
